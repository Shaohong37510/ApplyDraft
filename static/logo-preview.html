<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Logo Preview</title>
<style>
  body { background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 60px; padding: 60px; font-family: sans-serif; }
  .block { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .block label { font-size: 13px; color: #888; }
  .bg-white { background: #fff; padding: 30px; border: 1px solid #eee; border-radius: 12px; }
  .bg-dark { background: #0d0f18; padding: 30px; border-radius: 12px; }
</style>
</head>
<body>

<div class="block">
  <label>Icon — White Background</label>
  <div class="bg-white">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#c026d3"/>
          <stop offset="50%" stop-color="#9333ea"/>
          <stop offset="100%" stop-color="#6c8cff"/>
        </linearGradient>
      </defs>
      <g transform="translate(50,50)" fill="url(#g1)">
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(0)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(45)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(90)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(135)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(180)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(225)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(270)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(315)"/>
      </g>
    </svg>
  </div>
</div>

<div class="block">
  <label>Icon — Dark Background</label>
  <div class="bg-dark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
      <defs>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#c026d3"/>
          <stop offset="50%" stop-color="#9333ea"/>
          <stop offset="100%" stop-color="#6c8cff"/>
        </linearGradient>
      </defs>
      <g transform="translate(50,50)" fill="url(#g2)">
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(0)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(45)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(90)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(135)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(180)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(225)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(270)"/>
        <ellipse cx="0" cy="-21" rx="11.5" ry="21" transform="rotate(315)"/>
      </g>
    </svg>
  </div>
</div>

<div class="block">
  <label>Full Logo — White Background</label>
  <div class="bg-white">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
      <defs>
        <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#c026d3"/>
          <stop offset="50%" stop-color="#9333ea"/>
          <stop offset="100%" stop-color="#6c8cff"/>
        </linearGradient>
      </defs>
      <g transform="translate(40,40)" fill="url(#g3)">
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(0)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(45)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(90)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(135)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(180)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(225)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(270)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(315)"/>
      </g>
      <text x="76" y="52" font-family="'Nunito','Poppins','Inter',sans-serif" font-weight="700" font-size="36" fill="url(#g3)" letter-spacing="-0.5">Applydraft</text>
    </svg>
  </div>
</div>

<div class="block">
  <label>Full Logo — Dark Background</label>
  <div class="bg-dark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
      <defs>
        <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#c026d3"/>
          <stop offset="50%" stop-color="#9333ea"/>
          <stop offset="100%" stop-color="#6c8cff"/>
        </linearGradient>
      </defs>
      <g transform="translate(40,40)" fill="url(#g4)">
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(0)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(45)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(90)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(135)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(180)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(225)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(270)"/>
        <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(315)"/>
      </g>
      <text x="76" y="52" font-family="'Nunito','Poppins','Inter',sans-serif" font-weight="700" font-size="36" fill="url(#g4)" letter-spacing="-0.5">Applydraft</text>
    </svg>
  </div>
</div>

</body>
</html>
