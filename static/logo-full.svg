    <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(90)"/>
    <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(135)"/>
    <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(180)"/>
    <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(225)"/>
    <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(270)"/>
    <ellipse cx="0" cy="-17" rx="9.5" ry="17" transform="rotate(315)"/>
  </g>

  <!-- Text: Applydraft -->
  <text
    x="76"
    y="52"
    font-family="'Nunito', 'Poppins', 'Inter', Arial Rounded MT Bold, sans-serif"
